<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="후니 라디오">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="전 세계 라디오 방송국을 국가 → 지역 → 방송국 순서로 골라 듣는 후니가 듣고 싶은 세계라디오 모음집">
<title>후니가 듣고 싶은 세계라디오 모음집</title>
<style>
  :root{
    --bg:#070c16;
    --bg2:#0b1322;
    --card:#111c2e;
    --card2:#16243a;
    --line:#22314c;
    --ink:#e9f0ff;
    --ink2:#9fb0cc;
    --ink3:#6d7f9c;
    --accent:#4f8dff;
    --accent2:#7bd1ff;
    --gold:#ffcf5c;
    --ok:#3ddc97;
    --warn:#ffb057;
    --danger:#ff6b6b;
    --r:16px;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
    --player-h:76px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    background:
      radial-gradient(1200px 600px at 82% -10%, rgba(79,141,255,.20), transparent 60%),
      radial-gradient(900px 500px at 6% 0%, rgba(123,209,255,.12), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:15px;line-height:1.45;
    min-height:100vh;
    min-height:100dvh;
    padding-bottom:calc(var(--player-h) + 26px + var(--safe-b));
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;touch-action:manipulation}
  a{color:var(--accent2)}
  .wrap{max-width:1180px;margin:0 auto;padding-left:calc(16px + var(--safe-l));padding-right:calc(16px + var(--safe-r))}

  /* ---------- header ---------- */
  .app-header{position:sticky;top:0;z-index:30;background:rgba(7,12,22,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(34,49,76,.7);padding-top:var(--safe-t)}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:2px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .globe{font-size:20px;line-height:1;flex:none;filter:drop-shadow(0 0 10px rgba(123,209,255,.45))}
  .brand h1{margin:0;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.18;letter-spacing:-.02em}
  .brand h1 .t1{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.01em;white-space:nowrap}
  .brand h1 .t2{font-size:19px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .brand .tag{font-size:11.5px;color:var(--ink3);margin-left:2px;white-space:nowrap}
  /* 전체 앱 목록(런처)으로 이동 */
  .home-pill{flex:none;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border-radius:999px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;
    font-size:12.5px;font-weight:700;line-height:1;text-decoration:none;white-space:nowrap;
    -webkit-tap-highlight-color:transparent}
  .home-pill:active{background:rgba(255,255,255,.24)}
  @media (max-width:370px){ .brand h1 .t2{font-size:17.5px} }
  footer .freset{color:var(--ink3);font-size:11.5px;text-decoration:underline;padding:0;vertical-align:baseline}
  footer .freset b{color:var(--ink2);font-weight:700}
  .search-wrap{padding:8px 0 11px}
  .searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
      border-radius:999px;padding:9px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);min-width:0}
  .searchbar .ico{font-size:14px;opacity:.75;flex:none}
  .searchbar input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:14.5px;color:var(--ink);padding:0}
  .searchbar input::placeholder{color:var(--ink3)}
  .searchbar input::-webkit-search-cancel-button,
  .searchbar input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
  .searchbar .clr{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--ink2);font-size:12px;display:grid;place-items:center;flex:none}
  .searchbar .clr[hidden]{display:none}

  /* ---------- net note ---------- */
  .srcbar{display:flex;align-items:center;gap:7px;margin:10px 0 0;padding:7px 11px;border-radius:10px;font-size:12px;
    color:#ffd9a8;background:rgba(255,176,87,.10);border:1px solid rgba(255,176,87,.26)}
  .srcbar[hidden]{display:none}

  /* ---------- crumbs ---------- */
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:11px 0 1px;font-size:13px;color:var(--ink2)}
  .crumbs .cb{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink2);font-weight:600}
  .crumbs .cb:hover{color:var(--ink);background:rgba(255,255,255,.09)}
  .crumbs .sep{color:var(--ink3);opacity:.7}
  .crumbs .cur{color:var(--ink);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- section ---------- */
  main{padding:4px 0 8px;min-width:0}
  .sec{margin:18px 0 4px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px;flex-wrap:wrap}
  .sec-h h2{margin:0;font-size:15px;letter-spacing:-.01em;min-width:0}
  .sec-h h2 .em{color:var(--accent2)}
  .sec-h .side{font-size:12px;color:var(--ink3);font-weight:600}
  .chips{display:inline-flex;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:3px;border-radius:999px}
  .chips button{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink2)}
  .chips button.on{background:var(--accent);color:#fff}

  /* ---------- country tiles ---------- */
  .countries{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .ct{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:14px;background:linear-gradient(180deg,var(--card2),var(--card));
      border:1px solid var(--line);text-align:left;transition:.15s;min-height:60px;min-width:0}
  .ct:hover{border-color:rgba(79,141,255,.55);transform:translateY(-1px)}
  .ct .flag{font-size:22px;line-height:1;flex:none;width:26px;text-align:center}
  .ct .nm{min-width:0;flex:1;overflow:hidden}
  .ct .nm b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ct .nm span{display:block;font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ct .cnt{font-size:10.5px;font-weight:800;color:var(--accent2);background:rgba(123,209,255,.12);border-radius:8px;padding:2px 6px;flex:none}
  .ct.pin{background:linear-gradient(135deg,rgba(79,141,255,.24),rgba(123,209,255,.10));border-color:rgba(79,141,255,.5)}

  /* ---------- region tiles ---------- */
  .regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .rt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px;border-radius:14px;
      background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);text-align:left;min-height:56px;min-width:0}
  .rt:hover{border-color:rgba(79,141,255,.55)}
  .rt .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt .nm small{display:block;font-size:11px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt .cnt{font-size:12px;font-weight:800;color:var(--ink2);background:rgba(255,255,255,.07);border-radius:999px;padding:3px 8px;flex:none}

  /* ---------- station tiles ---------- */
  .stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .st{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:7px;padding:9px 8px 10px;border-radius:16px;
      background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);text-align:left;transition:.15s;min-width:0}
  .st:hover{border-color:rgba(79,141,255,.5);transform:translateY(-1px)}
  .st .ico{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;display:grid;place-items:center;
      background:linear-gradient(140deg,#243250,#1a2740);isolation:isolate}
  .st .ico .ph{font-size:26px;opacity:.9}
  .st .ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0e1727;padding:8px}
  .st .nm{font-size:12px;font-weight:700;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em;word-break:break-word}
  .st .mt{font-size:10.5px;color:var(--ink3);font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
  .st .badge{position:absolute;top:6px;right:6px;z-index:4;font-size:9px;font-weight:800;letter-spacing:.02em;
      padding:2px 5px;border-radius:6px;background:rgba(255,176,87,.18);color:var(--warn);border:1px solid rgba(255,176,87,.35)}
  .st .fav{position:absolute;top:5px;left:5px;z-index:5;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
      font-size:13px;background:rgba(7,12,22,.66);color:#8ea3c4;border:1px solid rgba(255,255,255,.1);opacity:.55;transition:.12s}
  .st:hover .fav{opacity:1}
  .st.is-fav .fav{opacity:1;color:var(--gold);border-color:rgba(255,207,92,.45);background:rgba(7,12,22,.75)}
  .st.is-playing{border-color:var(--ok);box-shadow:0 0 0 1px rgba(61,220,151,.5),0 8px 24px rgba(61,220,151,.15)}
  .st.is-playing .ico{box-shadow:inset 0 0 0 2px rgba(61,220,151,.55)}
  .eq{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);display:none;align-items:flex-end;gap:2px;height:14px;z-index:3}
  .eq i{width:3px;background:var(--ok);border-radius:2px;animation:bar .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
  @keyframes bar{0%,100%{height:4px}50%{height:14px}}
  .st.is-playing .eq{display:flex}
  .st.is-playing .ico .ph{opacity:.35}

  /* ---------- list rows ---------- */
  .rows{display:flex;flex-direction:column;gap:8px}
  .rw{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;min-width:0}
  .rw:hover{border-color:rgba(79,141,255,.5)}
  .rw .ico{width:42px;height:42px;border-radius:10px;flex:none;overflow:hidden;position:relative;display:grid;place-items:center;background:#182639;font-size:18px}
  .rw .ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0e1727;padding:5px}
  .rw .tx{min-width:0;flex:1}
  .rw .tx b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rw .tx span{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rw .play{font-size:12px;font-weight:800;color:var(--accent2);padding:6px 10px;border-radius:999px;background:rgba(79,141,255,.14);border:1px solid rgba(79,141,255,.3);flex:none}
  .rw.is-playing{border-color:var(--ok)}

  /* ---------- states ---------- */
  .empty{padding:34px 16px;text-align:center;color:var(--ink2);background:rgba(255,255,255,.03);border:1px dashed var(--line);border-radius:16px}
  .empty .big{font-size:26px;margin-bottom:8px;opacity:.8}
  .empty p{margin:4px 0;font-size:13px}
  .loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:44px 0;color:var(--ink2);font-size:13px}
  .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(123,209,255,.25);border-top-color:var(--accent2);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .slim{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--ink3);font-size:12px}
  .note{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.55}
  .filt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:#ffd9a8;
    background:rgba(255,176,87,.09);border:1px solid rgba(255,176,87,.28);padding:8px 11px;border-radius:10px;margin:0 0 12px}
  .filt button{font-size:12px;font-weight:800;color:var(--accent2);background:rgba(79,141,255,.16);
    border:1px solid rgba(79,141,255,.35);border-radius:8px;padding:3px 9px}
  .err{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);border-radius:14px;padding:14px;color:#ffd3d3;font-size:13px}
  .err button{margin-top:10px;padding:8px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}

  /* ---------- player ---------- */
  .player{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(9,15,26,.98);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-top:1px solid rgba(34,49,76,.9);box-shadow:0 -10px 30px rgba(0,0,0,.5);
    padding:9px 0 calc(9px + var(--safe-b));
    padding-left:var(--safe-l);padding-right:var(--safe-r)}
  .p-in{max-width:1180px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px;min-width:0}
  .p-art{width:44px;height:44px;border-radius:11px;flex:none;overflow:hidden;position:relative;background:#182639;display:grid;place-items:center;font-size:19px;border:1px solid var(--line)}
  .p-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0e1727;padding:5px}
  .p-meta{min-width:0;flex:1}
  .p-name{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-sub{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .p-status{font-size:10.5px;font-weight:800;margin-top:3px;display:flex;align-items:center;gap:5px;color:var(--ink3)}
  .p-status .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none}
  .p-status.loading{color:var(--warn)}.p-status.loading .dot{background:var(--warn);animation:pulse 1s infinite}
  .p-status.playing{color:var(--ok)}.p-status.playing .dot{background:var(--ok);animation:pulse 1.4s infinite}
  .p-status.error{color:var(--danger)}.p-status.error .dot{background:var(--danger)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .p-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none;background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line)}
  .p-btn.main{width:46px;height:46px;background:linear-gradient(135deg,var(--accent),#2f6fe0);border:0;color:#fff;font-size:17px;box-shadow:0 6px 18px rgba(79,141,255,.35)}
  .p-btn.main:disabled{opacity:.45;box-shadow:none}
  .p-btn.fav{font-size:16px}
  .p-btn.fav.on{color:var(--gold);border-color:rgba(255,207,92,.45);background:rgba(255,207,92,.12)}
  .vol{display:flex;align-items:center;gap:7px;flex:none}
  .vol input{-webkit-appearance:none;appearance:none;width:86px;height:4px;border-radius:3px;background:#2a3b57;outline:none}
  .vol input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#dfe9ff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .vol input::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#dfe9ff}
  .vol .vic{font-size:13px;color:var(--ink3)}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(4,8,15,.72);backdrop-filter:blur(4px)}
  .modal[hidden]{display:none}
  .modal .card{width:100%;max-width:430px;background:linear-gradient(180deg,#152134,#0e1828);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);max-height:86dvh;overflow:auto}
  .modal h3{margin:0 0 10px;font-size:16px}
  .modal p{margin:0 0 9px;font-size:13px;color:var(--ink2);line-height:1.55}
  .modal p b{color:var(--ink)}
  .modal .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .modal .acts a,.modal .acts button{display:block;text-align:center;padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink)}
  .modal .acts .primary{background:linear-gradient(135deg,var(--accent),#2f6fe0);border:0;color:#fff}
  .modal .acts .ghost{background:none;color:var(--ink2)}

  footer{padding:24px 0 8px;text-align:center;color:var(--ink3);font-size:11px;line-height:1.7}

  /* ---------- phone ---------- */
  @media (max-width:640px){
    :root{--player-h:70px}
    body{font-size:14.5px;padding-bottom:calc(var(--player-h) + 20px + var(--safe-b))}
    .wrap{padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r))}
    .brand .tag{display:none}
    .brand h1{font-size:17.5px}
    .brand .globe{font-size:20px}
    .hdr{padding-top:8px}
    .search-wrap{padding:7px 0 9px}
    .searchbar{padding:8px 12px}
    .searchbar input{font-size:16px}
    .crumbs{font-size:12px;padding-top:9px;gap:5px}
    .crumbs .cb{padding:4px 9px;border-radius:999px}
    .sec{margin:15px 0 3px}
    .sec-h{margin-bottom:8px;gap:8px}
    .sec-h h2{font-size:14.5px}
    .sec-h .side{font-size:11.5px}
    .chips button{padding:4px 9px;font-size:11.5px}
    .countries{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .ct{padding:8px 9px;gap:7px;min-height:54px;border-radius:13px}
    .ct .flag{font-size:19px;width:22px}
    .ct .nm b{font-size:12.5px;line-height:1.25}
    .ct .nm span{font-size:9.5px}
    .ct .cnt{font-size:9.5px;padding:2px 4px;border-radius:7px}
    .regions{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .rt{padding:12px 12px;min-height:52px;border-radius:13px}
    .rt .nm{font-size:13.5px}
    .stations{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .st{padding:7px 6px 8px;border-radius:14px;gap:6px}
    .st .nm{font-size:11px;line-height:1.3;min-height:2.6em}
    .st .mt{font-size:9.5px}
    .st .fav{width:28px;height:28px;font-size:14px;opacity:.85}
    .st .ico img{padding:6px}
    .rw{padding:8px 10px;gap:9px}
    .rw .ico{width:38px;height:38px}
    .p-in{padding:0 12px;gap:8px}
    .p-art{width:40px;height:40px;border-radius:10px}
    .p-name{font-size:12.5px}
    .p-sub{font-size:10.5px}
    .p-status{font-size:10px;margin-top:2px}
    .p-btn{width:38px;height:38px}
    .p-btn.main{width:44px;height:44px}
    .p-btn.fav{width:34px;height:34px;font-size:15px}
    .vol{display:none}
    footer{font-size:10.5px;padding-bottom:2px}
    .modal .card{padding:18px;border-radius:18px}
  }
  @media (hover:none){
    .st .fav{background:rgba(7,12,22,.72)}
  }
  @media (min-width:641px) and (max-width:900px){
    .stations{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  }

function regionKey(raw, cc){
  var t = String(raw||'').trim();
  if(!t) return 'none';
  var low = t.toLowerCase();
  var ko = KO_REGION[low];
  if(ko) return 'ko:'+ko;
  if(cc==='US'){
    /* "New York NY", "San Francisco CA", "Miami, Florida", "Columbus Ohio" 같은 표기를 주 단위로 묶기 */
    var cands = [low];
    t.split(',').forEach(function(pp){ var q2 = pp.trim().toLowerCase(); if(q2) cands.push(q2); });
    var segs = t.split(/[\s,\/()]+/).filter(Boolean);
    segs.forEach(function(sg){ cands.push(sg.toLowerCase()); });
    for(var ci=0; ci<cands.length; ci++){
      var cd = cands[ci];
      if(cd.length===2 && US_STATE_KO[cd.toUpperCase()]) return 'ko:'+US_STATE_KO[cd.toUpperCase()];
      if(KO_REGION[cd]) return 'ko:'+KO_REGION[cd];
    }
  }
  return 'r:'+low;
}
function regionLabel(key, rawHint){
  if(!key || key==='none' || key==='~') return { main:'전국 · 지역 미지정', sub:'' };
  if(key.indexOf('ko:')===0) return { main:key.slice(3), sub: prettyRegion(rawHint||'') };
  return { main: prettyRegion(rawHint || key.slice(2)), sub:'' };
}

/* =========================================================
   데이터 — 내장 → 즉시 표시, 네트워크는 뒤에서
   ========================================================= */
function normCountry(c){
  return {
    code:String(c.iso_3166_1||c.code||'').toUpperCase(),
    en:String(c.name||c.en||'').replace(/^The\s+/i,''),
    count:Number(c.stationcount!=null?c.stationcount:c.count||0),
    flag:flagOf(c.iso_3166_1||c.code)
  };
}
function normStation(s){
  var url = s.url_resolved || s.url || '';
  var name = String(s.name||'이름 없음').replace(/\s+/g,' ').trim();
  return {
    uuid:String(s.stationuuid||''),
    name:name,
    url:url,
    alt:(s.url && s.url!==url) ? s.url : '',
    homepage:s.homepage||'',
    favicon:s.favicon||'',
    codec:String(s.codec||'').toUpperCase(),
    bitrate:Number(s.bitrate||0),
    state:String(s.state||''),
    country:String(s.country||''),
    countrycode:String(s.countrycode||'').toUpperCase(),
    clicks:Number(s.clickcount||0),
    ok:Number(s.lastcheckok==null? 1 : s.lastcheckok),
    hls:/m3u8/i.test(url),
    https:url.indexOf('https:')===0
  };
}
function stationsFromEmbed(code){
  var arr = (EM.stations && EM.stations[code]) || null;
  if(!arr || !arr.length) return null;
  arr = arr.filter(function(s){ return isHttpsUrl(s.l); });
  if(!arr.length) return null;
  return arr.map(function(s){
    return {
      uuid:s.u, name:s.n, url:s.l, alt:s.a||'', homepage:s.h||'', favicon:s.f||'',
      codec:s.c||'', bitrate:s.b||0, state:s.s||'', country:s.co||'',
      countrycode:String(s.cc||code||'').toUpperCase(), clicks:s.k||0,
      hls:/m3u8/i.test(s.l), https:String(s.l).indexOf('https:')===0
    };
  });
}
function countriesFromEmbed(){
  return (EM.countries||[]).map(function(c){
    return { code:String(c.c).toUpperCase(), en:String(c.en||'').replace(/^The\s+/i,''), count:Number(c.n||0), flag:flagOf(c.c) };
  });
}

/* ---------- API ---------- */
var bases = shuffle(API_HOSTS.slice());

function fetchT(url, ms){
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctl){ try{ ctl.abort(); }catch(e){} } }, ms||6000);
  var opt = ctl ? {signal:ctl.signal, cache:'no-store'} : {cache:'no-store'};
  return fetch(url, opt).then(function(r){ clearTimeout(timer); return r; }, function(e){ clearTimeout(timer); throw e; });
}
/* 미러 발견은 첫 화면 뒤에서만. 실패해도 de1/de2로 계속 진행합니다. */
function discoverHosts(){
  fetchT('https://all.api.radio-browser.info/json/servers', T.servers)
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(arr){
      var hosts = [];
      (arr||[]).forEach(function(s){ if(s && s.name){ var h='https://'+s.name; if(hosts.indexOf(h)<0) hosts.push(h); } });
      if(hosts.length){
        shuffle(hosts);
        bases = hosts.concat(API_HOSTS.filter(function(h){ return hosts.indexOf(h)<0; }));
      }
    })
    .catch(function(){});
}
function apiGet(path, ms){
  var list = bases.slice();
  var i = 0;
  function attempt(){
    if(i >= list.length) return Promise.reject(new Error('모든 서버 접속 실패'));
    var host = list[i++];
    return fetchT(host+path, ms||6000).then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    }).then(function(data){
      bases = [host].concat(bases.filter(function(h){ return h!==host; }));
      return data;
    }).catch(function(){ return attempt(); });
  }
  return attempt();
}

function fetchCountriesApi(){
  return apiGet('/json/countries', T.countries).then(function(data){
    var by = {};
    (data||[]).forEach(function(c){
      if(!c || !c.iso_3166_1) return;
      if(Number(c.stationcount)<=0) return;
      if(!String(c.name||'').trim()) return;
      var code = String(c.iso_3166_1).toUpperCase();
      if(code.length!==2) return;
      var n = normCountry(c);
      if(by[code]) by[code].count += n.count; else by[code] = n;
    });
    var list = Object.keys(by).map(function(k){ return by[k]; });
    /* 내장 목록에만 있는 나라는 남겨 둡니다 */
    (S.countries||[]).forEach(function(c){ if(!by[c.code]) list.push(c); });
    return list;
  });
}

function sortStations(list){
  list.sort(function(a,b){
    if(a.https!==b.https) return a.https ? -1 : 1;
    var av = /H\.?264|VIDEO/i.test(a.codec) ? 1 : 0;
    var bv = /H\.?264|VIDEO/i.test(b.codec) ? 1 : 0;
    if(av!==bv) return av-bv;
    return b.clicks-a.clicks;
  });
  return list;
}
function fetchStationsApi(code){
  var path = '/json/stations/search?countrycode='+encodeURIComponent(code)+
             '&limit=800&hidebroken=true&order=clickcount&reverse=true';
  return apiGet(path, T.stations).then(function(data){
    /* https 로 접속되는, 검증된(lastcheckok=1) 방송국만 남깁니다 */
    var list = (data||[]).filter(function(s){
      var u = String(s && (s.url_resolved||s.url) || '');
      return s && isHttpsUrl(u) && Number(s.lastcheckok)===1;
    }).map(normStation);
    return sortStations(list);
  });
}

/* ---------- 상태/표시 ---------- */
function setOffline(v){
  S.offline = !!v;
  if(netnoteEl) netnoteEl.hidden = !S.offline;
}
function countries(){
  if(!S.countries){
    var cached = readJSON(LS.countries);
    if(cached && cached.data && cached.data.length>100) S.countries = cached.data;
    else S.countries = countriesFromEmbed();
  }
  return S.countries || [];
}
function stationsFor(code){
  if(S.stations.has(code)) return S.stations.get(code);
  var emb = stationsFromEmbed(code);
  if(emb){ S.stations.set(code, emb); return emb; }
  return null;
}
function ensureCountries(){
  if(S.countriesReq || !online()) return;
  S.countriesReq = true;
  fetchCountriesApi().then(function(list){
    S.countriesReq = false;
    if(!list || list.length < 100) return;
    var changed = !S.countries || list.length !== S.countries.length;
    S.countries = list;
    writeJSON(LS.countries, {t:Date.now(), data:list});
    setOffline(false);
    if(changed && S.route.view==='home' && !S.q) render();
  }).catch(function(){ S.countriesReq = false; setOffline(true); });
}
function ensureStations(code){
  if(S.refreshed[code] || S.refreshReq[code]) return;
  /* 내장 목록은 한 곳씩 실제 재생까지 확인한 목록이라 API 결과로 덮어쓰지 않습니다 */
  if(EM.stations && EM.stations[code] && EM.stations[code].length){ S.refreshed[code] = true; return; }
  if(!online()){ setOffline(true); return; }
  S.refreshReq[code] = true;
  fetchStationsApi(code).then(function(list){
    S.refreshReq[code] = false;
    if(!list || !list.length) return;
    S.stations.set(code, list);
    S.refreshed[code] = true;
    setOffline(false);
    if(S.route.code===code) render();
  }).catch(function(){ S.refreshReq[code] = false; setOffline(true); });
}

   재생
   ========================================================= */
var audio = new Audio();
audio.preload = 'none';
var wd = null;

function setStatus(kind, text){
  var el = $('#p-status');
  el.className = 'p-status' + (kind? ' '+kind : '');
  $('#p-statustx').textContent = text;
}
function teardown(){
  clearTimeout(wd);
  if(S.hls){ try{ S.hls.destroy(); }catch(e){} S.hls = null; }
  try{ audio.pause(); }catch(e){}
  audio.removeAttribute('src');
  try{ audio.load(); }catch(e){}
}
function canNativeHLS(){
  try{ return !!audio.canPlayType('application/vnd.apple.mpegurl'); }catch(e){ return false; }
}
function preferNativeHLS(){
  var ua = navigator.userAgent || '';
  if(/iPad|iPhone|iPod/.test(ua)) return true;
  if(/Macintosh/.test(ua) && /Safari/.test(ua) && !/Chrome|Chromium|Edg/.test(ua)) return true;
  return false;
}
/* hls.js는 첫 화면을 막지 않도록 뒤에서 불러옵니다. */
var hlsState = 0; /* 0 없음, 1 불러오는 중, 2 준비됨, 3 실패 */
function loadHls(){
  if(window.Hls && window.Hls.isSupported()){ hlsState = 2; return; }
  if(hlsState===1 || hlsState===3) return;
  hlsState = 1;
  (function next(i){
    if(i >= HLS_CDN.length){ hlsState = 3; return; }
    var s = document.createElement('script');
    s.src = HLS_CDN[i];
    s.async = true;
    s.onload = function(){ hlsState = (window.Hls && window.Hls.isSupported()) ? 2 : 3; };
    s.onerror = function(){ s.remove(); next(i+1); };
    document.head.appendChild(s);
  })(0);
}

function playStation(st){
  if(!st || !st.url) return;
  teardown();
  S.current = st;
  S.playing = false;
  S.loadingPlay = true;
  S.failed = false;
  var token = ++S.playToken;
  S.failFn = function(msg){ failPlay(token, st, msg); };
  updatePlayer();
  setStatus('loading','연결 중…');
  $('#p-play').textContent = '⏸';
  markPlaying();

  var url = st.url;
  audio.volume = S.vol;

  clearTimeout(wd);
  wd = setTimeout(function(){
    if(token!==S.playToken || S.playing || S.failed) return;
    if(audio.readyState < 2) S.failFn('스트림 응답이 없습니다(시간 초과)');
  }, T.playback);

  var isHLS = st.hls;
  try{
    if(isHLS && !preferNativeHLS()){
      if(!(window.Hls && window.Hls.isSupported()) && canNativeHLS()){
        audio.src = url;
      }else if(!(window.Hls && window.Hls.isSupported())){
        /* 아직 준비 전이면 한 번 불러보고 몇 초만 기다립니다 */
        loadHls();
        var waited = 0;
        var tick = setInterval(function(){
          if(token!==S.playToken) { clearInterval(tick); return; }
          waited += 250;
          if(window.Hls && window.Hls.isSupported()){
            clearInterval(tick); startHls(url, token);
          }else if(waited >= 6000){
            clearInterval(tick);
            if(canNativeHLS()){ audio.src = url; tryPlay(token); }
            else S.failFn('이 브라우저에서는 HLS 스트림을 재생할 수 없습니다');
          }
        }, 250);
        return;
      }else{
        startHls(url, token);
      }
    }else{
      audio.src = url;
    }
    tryPlay(token);
  }catch(e){
    S.failFn('재생 준비 중 오류');
  }
}
function startHls(url, token){
  if(token!==S.playToken) return;
  try{
    var hls = new window.Hls({ enableWorker:true, manifestLoadingTimeOut:12000, manifestLoadingMaxRetry:2, levelLoadingMaxRetry:2 });
    S.hls = hls;
    hls.on(window.Hls.Events.ERROR, function(ev, data){
      if(token!==S.playToken) return;
      if(data && data.fatal){
        var why = data.type==='networkError' ? 'HLS 네트워크 오류'
                : data.type==='mediaError' ? 'HLS 미디어 오류' : 'HLS 오류';
        S.failFn(why + (data.details? ' ('+data.details+')' : ''));
      }
    });
    hls.loadSource(url);
    hls.attachMedia(audio);
    tryPlay(token);
  }catch(e){
    S.failFn('HLS 준비 중 오류');
  }
}
function tryPlay(token){
  if(token!==S.playToken) return;
  var p = audio.play();
  if(p && p.catch){
    p.catch(function(e){
      if(token!==S.playToken) return;
      if(e && e.name==='AbortError') return;
      if(e && e.name==='NotAllowedError') { setStatus('', '재생 버튼을 눌러 주세요'); $('#p-play').textContent='▶'; S.loadingPlay=false; markPlaying(); return; }
      S.failFn('재생이 차단되었습니다' + (e && e.name? ' ('+e.name+')' : ''));
    });
  }
}

function failPlay(token, st, msg){
  if(token!==S.playToken || S.failed) return;
  /* 재생되지 않은 방송국은 목록에서 자동으로 숨깁니다(아래 숨긴 방송국 되돌리기로 복구)
     오프라인일 때는 일시적인 실패일 수 있으므로 숨기지 않습니다. */
  var hidNow = false;
  if(st && online()){ noteHide(st.uuid); hidNow = true; }
  S.failed = true;
  S.loadingPlay = false;
  S.playing = false;
  clearTimeout(wd);
  setStatus('error', '재생할 수 없습니다');
  $('#p-play').textContent = '▶';
  markPlaying();
  if(hidNow){ try{ render(); }catch(e){} }
  showFailModal(st, msg);
}

audio.addEventListener('playing', function(){
  if(!S.current || S.failed) return;
  S.playing = true;
  S.loadingPlay = false;
  if(S.current) unhide(S.current.uuid);
  clearTimeout(wd);
  setStatus('playing','재생 중 · LIVE');
  $('#p-play').textContent = '⏸';
  markPlaying();
  updateMediaSession(S.current);
  pushRecent(S.current);
});
audio.addEventListener('waiting', function(){
  if(!S.current || S.failed || !S.playing) return;
  setStatus('loading','버퍼링…');
});
audio.addEventListener('pause', function(){
  if(!S.current || S.loadingPlay || S.failed) return;

  setStatus('', '일시정지');
  $('#p-play').textContent = '▶';
  markPlaying();
});
audio.addEventListener('error', function(){
  if(!S.current || !S.failFn) return;
  if(!audio.currentSrc && !audio.getAttribute('src')) return;
  S.failFn(audio.error ? ('미디어 오류 (code '+(audio.error.code||0)+')') : '스트림 오류');
});

function togglePlay(){
  if(!S.current) return;
  if(S.playing || S.loadingPlay){
    audio.pause();
    S.playing = false;
    S.loadingPlay = false;
    setStatus('', '일시정지');
    $('#p-play').textContent = '▶';
    markPlaying();
  }else{
    playStation(S.current);
  }
}

/* ---------- 플레이어 UI ---------- */
function stationSub(st){
  if(!st) return '';
  var cn = countryName({code:st.countrycode, en:st.country||''});
  var rl = st.state ? regionLabel(regionKey(st.state, st.countrycode), st.state).main : '';
  var parts = [cn.main || st.countrycode];
  if(rl && rl!=='전국 · 지역 미지정') parts.push(rl);
  return parts.filter(Boolean).join(' · ');
}
function artInner(st, size){
  var g = gradFor(st.name);
  var img = st.favicon ? '<img src="'+esc(st.favicon)+'" alt="" loading="lazy" onerror="this.remove()">' : '';
  return '<span style="position:absolute;inset:0;background:'+g+';opacity:.9"></span>'+img+'<span style="position:relative;z-index:1;font-size:'+Math.round(size*0.42)+'px">🎙</span>';
}
function gradFor(seed){
  var h = 0, s = String(seed||'');
  for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 360;
  return 'linear-gradient(140deg, hsl('+h+',55%,32%), hsl('+((h+40)%360)+',45%,18%))';
}
function updatePlayer(){
  var st = S.current;
  if(!st){
    $('#p-name').textContent = '방송국을 선택하세요';
    $('#p-sub').textContent = '국가 → 지역 → 방송국';
    $('#p-art').innerHTML = '📻';
    $('#p-play').disabled = true;
    $('#p-fav').style.display = 'none';
    return;
  }
  $('#p-name').textContent = st.name;
  $('#p-sub').textContent = stationSub(st);
  $('#p-art').innerHTML = artInner(st, 44);
  $('#p-play').disabled = false;
  var f = $('#p-fav');
  f.style.display = 'grid';
  var on = isFav(st.uuid);
  f.textContent = on ? '★' : '☆';
  f.className = 'p-btn fav' + (on ? ' on' : '');
}
function updateMediaSession(st){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new window.MediaMetadata({
      title: st.name, artist: stationSub(st), album: '후니의 세계라디오'
    });
    navigator.mediaSession.setActionHandler('play', function(){ togglePlay(); });
    navigator.mediaSession.setActionHandler('pause', function(){ togglePlay(); });

/* ---------- 즐겨찾기 / 최근 ---------- */
function isFav(uuid){ return S.favs.some(function(f){ return f.uuid===uuid; }); }
function minify(st){
  return { uuid:st.uuid, name:st.name, url:st.url, alt:st.alt, homepage:st.homepage, favicon:st.favicon,
           codec:st.codec, bitrate:st.bitrate, state:st.state, country:st.country,
           countrycode:st.countrycode, clicks:st.clicks, hls:st.hls, https:st.https };
}
function toggleFav(st){
  if(!st) return;
  var i = -1;
  for(var k=0;k<S.favs.length;k++){ if(S.favs[k].uuid===st.uuid){ i=k; break; } }
  if(i>=0) S.favs.splice(i,1);
  else S.favs.unshift(minify(st));
  writeJSON(LS.favs, S.favs);
  updatePlayer();
  markFavs();
  if(S.route.view==='favs' || S.route.view==='home') render();
}
function pushRecent(st){
  S.recent = S.recent.filter(function(r){ return r.uuid!==st.uuid; });
  S.recent.unshift(minify(st));
  if(S.recent.length>12) S.recent = S.recent.slice(0,12);
  writeJSON(LS.recent, S.recent);
  if(S.route.view==='home' && !S.q) render();
}
function markPlaying(){
  var uuid = S.current && S.playing ? S.current.uuid : null;
  var nodes = document.querySelectorAll('[data-uuid]');
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    if(uuid && n.getAttribute('data-uuid')===uuid) n.classList.add('is-playing');
    else n.classList.remove('is-playing');
  }
}
function markFavs(){
  var nodes = document.querySelectorAll('[data-uuid]');
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    var on = isFav(n.getAttribute('data-uuid'));
    if(on) n.classList.add('is-fav'); else n.classList.remove('is-fav');
    var star = n.querySelector && n.querySelector('.fav');
    if(star) star.textContent = on ? '★' : '☆';
  }
}

function parseHash(){
  var h = (location.hash||'').replace(/^#/,'');
  var parts = h.split('?')[0].split('/').filter(Boolean).map(function(p){
    try{ return decodeURIComponent(p); }catch(e){ return p; }
  });
  if(parts[0]==='f') return {view:'favs'};
  if(parts[0]==='c' && parts[1]){
    var code = parts[1].toUpperCase();
    if(parts[2]) return {view:'stations', code:code, region:parts[2]};
    return {view:'regions', code:code};
  }
  return {view:'home'};
}
function go(hash){
  if(location.hash===hash){ render(); }
  else location.hash = hash;
}

});

/* ---------- 검색 ---------- */
function localStationSearch(q){
  var seen = {}, out = [];
  S.stations.forEach(function(list){
    (list||[]).forEach(function(st){
      if(seen[st.uuid] || isHidden(st.uuid)) return;
      if(String(st.name||'').toLowerCase().indexOf(q)>=0){
        seen[st.uuid] = 1; out.push(st);
      }
    });
  });
  out.sort(function(a,b){ return (b.https?1:0)-(a.https?1:0) || b.clicks-a.clicks; });
  return out.slice(0,40);
}
function globalSearch(q){
  var qq = String(q||'').trim();
  if(!qq){ S.gs = { q:'', state:'idle', items:[], remote:0 }; paintIfHome(); return; }
  var low = qq.toLowerCase();
  var local = localStationSearch(low);
  S.gs = { q:qq, state: online() ? 'loading' : 'offline', items: local, remote:0 };
  paintIfHome();
  if(!online()) return;
  apiGet('/json/stations/search?name='+encodeURIComponent(qq)+'&limit=40&hidebroken=true&order=clickcount&reverse=true', T.search)
    .then(function(data){
      if(S.gs.q!==qq) return;
      var items = (data||[]).filter(function(s){
        var u = String(s && (s.url_resolved||s.url) || '');
        return s && isHttpsUrl(u) && Number(s.lastcheckok)===1;
      }).map(normStation);
      items = items.filter(function(s){ return !isHidden(s.uuid); });
      var seen = {}; var merged = [];
      items.forEach(function(s){ if(!seen[s.uuid]){ seen[s.uuid]=1; merged.push(s); } });
      S.gs.items.forEach(function(s){ if(!seen[s.uuid]){ seen[s.uuid]=1; merged.push(s); } });
      S.gs = { q:qq, state:'done', items: merged, remote: items.length };
      setOffline(false);
      paintIfHome();
    })
    .catch(function(){
      if(S.gs.q!==qq) return;
      S.gs = { q:qq, state: S.gs.items.length ? 'offline' : 'offline', items: S.gs.items, remote:0 };
      setOffline(true);
      paintIfHome();
    });
}
var globalSearchDebounced = debounce(function(q){ globalSearch(q); }, 450);

      setOffline(true);
      mainEl.innerHTML = '<section class="sec"><div class="sec-h"><h2>'+head+'</h2></div>'+
        '<div class="err"><b>이 국가의 방송국 목록을 불러오지 못했습니다.</b><br>'+
        (online()? '잠시 후 다시 시도해 주세요.' : '오프라인입니다. 저장된 국가(한국·미국·일본·영국)는 인터넷 없이도 열립니다.')+
        '<br><button data-retry="1">다시 시도</button></div></section>';
    });
    return;
  }

  paintRegions(seq, code, head, list);
  ensureStations(code);
}
function paintRegions(seq, code, head, list){
  var q = S.q.trim().toLowerCase();
  list = visible(list);
  var groups = new Map();
  list.forEach(function(st){
    var key = regionKey(st.state, code);
    if(!groups.has(key)) groups.set(key, { key:key, raw:(st.state||'').trim(), items:[] });
    groups.get(key).items.push(st);
  });
  var arr = [];
  groups.forEach(function(g){ arr.push(g); });
  arr.sort(function(a,b){
    if(a.key==='none') return 1;
    if(b.key==='none') return -1;
    if(b.items.length!==a.items.length) return b.items.length-a.items.length;
    return regionLabel(a.key, a.raw).main.localeCompare(regionLabel(b.key, b.raw).main,'ko');
  });
  if(q){
    arr = arr.filter(function(g){
      var lb = regionLabel(g.key, g.raw);
      return lb.main.toLowerCase().indexOf(q)>=0 || lb.sub.toLowerCase().indexOf(q)>=0;
    });
  }

  var html = '<section class="sec"><div class="sec-h"><h2>지역 선택 <span class="side">'+arr.length+'개 지역</span></h2></div>';
  if(q) html += filterNote(S.q.trim());
  if(!arr.length){
    html += '<div class="empty"><div class="big">🗺️</div><p>해당하는 지역이 없습니다.</p></div>';
  }else{
    html += '<div class="regions">'+arr.map(function(g){
      var rl = regionLabel(g.key, g.raw);
      return '<button class="rt" data-region="'+esc(g.key)+'">'+
        '<span class="nm">'+esc(rl.main)+(rl.sub? '<small>'+esc(rl.sub)+'</small>':'')+'</span>'+
        '<span class="cnt">'+g.items.length+'</span></button>';
    }).join('')+'</div>';
  }
  html += '<p class="note">지역 정보는 방송국 등록 자료 기준이라 비어 있는 경우가 있습니다. “전국 · 지역 미지정”에는 여러 지역을 함께 방송하는 방송국이 모여 있습니다.'+
          (list.length>=800? '<br>방송국이 많은 나라라 인기순 상위 800개만 가져와 지역을 정리했습니다.' : '')+'</p></section>';
  mainEl.innerHTML = html;
  markFavs();
}

/* ---------- 방송국 그리드 ---------- */
function regionStations(list, code, region){
  return list.filter(function(st){ return regionKey(st.state, code)===region; });
}
function renderStations(seq, code, region){
  if(region==='~') region = 'none';
  var list = stationsFor(code);
  if(list){
    paintStations(seq, code, region, list);
    ensureStations(code);
    return;
  }
  mainEl.innerHTML = '<div class="loading"><span class="spin"></span> 방송국을 불러오는 중…</div>';
  fetchStationsApi(code).then(function(l){
    if(seq!==S.seq) return;
    S.stations.set(code, l); S.refreshed[code]=true; setOffline(false);
    render();
  }).catch(function(){
    if(seq!==S.seq) return;
    setOffline(true);
    mainEl.innerHTML = '<div class="err"><b>방송국 목록을 불러오지 못했습니다.</b><br>'+
      (online()? '잠시 후 다시 시도해 주세요.' : '오프라인입니다. 저장된 국가(한국·미국·일본·영국)는 인터넷 없이도 열립니다.')+
      '<br><button data-retry="1">다시 시도</button></div>';
  });
}
function paintStations(seq, code, region, list){
  var q = S.q.trim().toLowerCase();
  var items = visible(regionStations(list, code, region));
  if(q){
    items = items.filter(function(st){ return st.name.toLowerCase().indexOf(q)>=0 || metaLine(st).toLowerCase().indexOf(q)>=0; });
  }
  var rl = regionLabel(region);

  var html = '<section class="sec"><div class="sec-h"><h2>'+esc(rl.main)+' <span class="side">'+items.length+'개 방송국</span></h2></div>';
  if(q) html += filterNote(S.q.trim());
  if(!items.length){
    html += '<div class="empty"><div class="big">📻</div><p>이 지역에 표시할 방송국이 없습니다.</p></div>';
  }else{
    html += '<div class="stations">'+items.map(stationTileFull).join('')+'</div>';
    html += '<p class="note">아이콘을 누르면 바로 재생됩니다. 재생되지 않는 방송국은 목록에서 자동으로 숨겨집니다. 왼쪽 위 ☆ 는 즐겨찾기입니다.'+
            (list.length>=800? '<br>방송국이 많은 나라라 인기순 상위 800개만 표시합니다.' : '')+'</p>';
  }
  html += '</section>';
  mainEl.innerHTML = html;
  markPlaying(); markFavs();
}

/* =========================================================
   모달
   ========================================================= */
function openModal(title, bodyHtml, actions){
  $('#m-title').textContent = title;
  $('#m-body').innerHTML = bodyHtml;
  var box = $('#m-acts');
  box.innerHTML = '';
  (actions||[]).forEach(function(a){
    var el;
    if(a.href){
      el = document.createElement('a');
      el.href = a.href; el.target = '_blank'; el.rel = 'noopener';
      el.textContent = a.t;
    }else{
      el = document.createElement('button');
      el.textContent = a.t;
      el.addEventListener('click', a.act || closeModal);
    }
    if(a.cls) el.className = a.cls;
    box.appendChild(el);
  });
  $('#modal').hidden = false;
}
function closeModal(){ $('#modal').hidden = true; }
$('#modal').addEventListener('click', function(e){ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !$('#modal').hidden) closeModal(); });

/* =========================================================
   이벤트
   ========================================================= */
function findStation(uuid){
  var all = [];
  S.stations.forEach(function(list){ all = all.concat(list); });
  all = all.concat(S.favs, S.recent, (S.gs.items||[]));
  if(S.current && S.current.uuid===uuid) all.unshift(S.current);
  for(var i=0;i<all.length;i++){ if(all[i] && all[i].uuid===uuid) return all[i]; }
  return null;
}

document.addEventListener('click', function(e){
  var t = e.target;

  var favBtn = t.closest && t.closest('[data-fav]');
  if(favBtn){
    e.preventDefault(); e.stopPropagation();
    var st0 = findStation(favBtn.getAttribute('data-fav'));
    if(st0) toggleFav(st0);
    return;
  }
  var retry = t.closest && t.closest('[data-retry]');
  if(retry){ S.refreshed={}; S.refreshReq={}; S.stations = new Map(); S.countriesReq=false; render(); return; }

  var clr2 = t.closest && t.closest('[data-clear]');
  if(clr2){ qEl.value=''; S.q=''; S.gs.q=''; $('#qclr').hidden = true; render(); return; }

  var sortBtn = t.closest && t.closest('[data-sort]');
  if(sortBtn){ S.sort = sortBtn.getAttribute('data-sort'); render(); return; }

  if(t.closest && t.closest('#hidreset')){
    S.hidden = []; writeJSON(LS.hidden, S.hidden); paintHiddenBox();
    S.refreshed = {}; S.refreshReq = {}; render();
    return;
  }

  var goBtn = t.closest && t.closest('[data-go]');
  if(goBtn){ go(goBtn.getAttribute('data-go')); return; }

  var cBtn = t.closest && t.closest('[data-country]');
  if(cBtn){ go('#/c/'+encodeURIComponent(cBtn.getAttribute('data-country'))); return; }

  var rBtn = t.closest && t.closest('[data-region]');
  if(rBtn){
    var code = S.route.code;
    go('#/c/'+encodeURIComponent(code)+'/'+encodeURIComponent(rBtn.getAttribute('data-region')));
    return;
  }

  var sBtn = t.closest && t.closest('[data-station]');
  if(sBtn){
    var st = findStation(sBtn.getAttribute('data-station'));
    if(st) playStation(st);
    return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  var el = e.target;
  if(el && el.getAttribute && el.getAttribute('data-station')){
    e.preventDefault();
    var st = findStation(el.getAttribute('data-station'));
    if(st) playStation(st);
  }
});

$('#p-play').addEventListener('click', togglePlay);
$('#p-fav').addEventListener('click', function(){ if(S.current) toggleFav(S.current); });

var volEl = $('#vol');
volEl.value = String(Math.round(S.vol*100));
volEl.addEventListener('input', function(){
  S.vol = Math.max(0, Math.min(1, Number(volEl.value)/100));
  audio.volume = S.vol;
  writeJSON(LS.vol, S.vol);
});

var qEl = $('#q');
qEl.addEventListener('input', function(){
  S.q = qEl.value;
  $('#qclr').hidden = !S.q;
  render();
});
$('#qclr').addEventListener('click', function(){
  qEl.value=''; S.q=''; S.gs.q=''; $('#qclr').hidden=true; render();
});

window.addEventListener('online', function(){ setOffline(false); ensureCountries(); });
window.addEventListener('offline', function(){ setOffline(true); });

/* =========================================================
   시작 — 네트워크를 기다리지 않고 바로 그립니다
   ========================================================= */
(function boot(){
  var v = readJSON(LS.vol);
  if(typeof v==='number' && v>=0 && v<=1){ S.vol = v; volEl.value = String(Math.round(v*100)); }
  var f = readJSON(LS.favs); if(Array.isArray(f)) S.favs = f.filter(function(x){ return x && x.uuid && x.url; });
  var rc = readJSON(LS.recent); if(Array.isArray(rc)) S.recent = rc.filter(function(x){ return x && x.uuid && x.url; });
  var hd = readJSON(LS.hidden); if(Array.isArray(hd)) S.hidden = hd.filter(function(x){ return typeof x==='string' && x; });
  audio.volume = S.vol;

  /* 내장 데이터 준비 */
  S.countries = countries();
  Object.keys(EM.stations||{}).forEach(function(code){ stationsFor(code); });

  if(!online()) setOffline(true);

  render();                       /* ← 여기서 즉시 첫 화면 */
  updatePlayer();
  paintHiddenBox();

  /* 첫 화면 뒤에서만 네트워크 시도 */
  setTimeout(function(){ try{ loadHls(); }catch(e){} }, 700);
  setTimeout(function(){ try{ discoverHosts(); }catch(e){} }, 1200);
  setTimeout(function(){ try{ ensureCountries(); }catch(e){} }, 400);
})();

})();
</script>
