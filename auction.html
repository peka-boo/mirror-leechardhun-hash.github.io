<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="경공매">
<meta name="application-name" content="경공매">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="법원경매·온비드 공매 물건을 보증금·최저가·종류·지역으로 찾는 후니의 경·공매 검색기">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>후니의 경·공매 검색기</title>
<style>
  :root{
    --bg:#0b1220;
    --bg2:#0e1727;
    --card:#111c2e;
    --card2:#16243a;
    --line:#22314c;
    --ink:#e9f0ff;
    --ink2:#9fb0cc;
    --ink3:#6d7f9c;
    --accent:#4f8dff;
    --accent2:#7bd1ff;
    --gold:#ffcf5c;
    --ok:#3ddc97;
    --warn:#ffb057;
    --danger:#ff6b6b;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    background:
      radial-gradient(1000px 500px at 82% -8%, rgba(79,141,255,.18), transparent 60%),
      radial-gradient(760px 420px at 4% 0%, rgba(123,209,255,.10), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:14.5px;line-height:1.45;
    min-height:100vh;min-height:100dvh;
    padding-bottom:calc(28px + var(--safe-b));
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;touch-action:manipulation}
  a{color:var(--accent2)}
  .wrap{max-width:560px;margin:0 auto;padding-left:14px;padding-right:14px}

  /* ---------- header ---------- */
  header.app{position:sticky;top:0;z-index:30;background:rgba(11,18,32,.92);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(34,49,76,.8);padding-top:var(--safe-t)}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:11px;padding-bottom:11px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .ico{font-size:21px;line-height:1;flex:none;filter:drop-shadow(0 0 10px rgba(123,209,255,.4))}
  .brand h1{margin:0;min-width:0;display:flex;flex-direction:column;gap:1px;letter-spacing:-.02em}
  .brand h1 .t1{font-size:10.5px;font-weight:600;color:var(--ink3);white-space:nowrap}
  .brand h1 .t2{font-size:18px;font-weight:800;color:var(--ink);white-space:nowrap}
  .home-pill{flex:none;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:999px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;
    font-size:12.5px;font-weight:700;line-height:1;text-decoration:none;white-space:nowrap}
  .home-pill:active{background:rgba(255,255,255,.24)}
  @media (max-width:359px){ .brand h1 .t2{font-size:16.5px} .home-pill{padding:0 10px;font-size:12px} }

  /* ---------- stat bar ---------- */
  .statbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:0 0 3px}
  .pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;
    font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink2)}
  .pill b{color:var(--ink);font-weight:800}
  .pill.count{background:rgba(79,141,255,.16);border-color:rgba(79,141,255,.45);color:#cfe2ff}
  .pill.count b{color:#fff}

  /* ---------- search / sort ---------- */
  .searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:9px 13px;margin:8px 0 9px;min-width:0}
  .searchbar .sico{font-size:14px;opacity:.75;flex:none}
  .searchbar input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:14.5px;color:var(--ink);padding:0}
  .searchbar input::placeholder{color:var(--ink3)}
  .searchbar input::-webkit-search-cancel-button,.searchbar input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
  .searchbar .clr{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.09);color:var(--ink2);
    font-size:11px;display:grid;place-items:center;flex:none}
  .searchbar .clr[hidden]{display:none}

  .ctrlrow{display:flex;gap:8px;align-items:center;margin:0 0 11px}
  .selwrap{position:relative;flex:1;min-width:0}
  .selwrap select{width:100%;appearance:none;-webkit-appearance:none;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px 30px 10px 12px;font-size:13px;font-weight:700;color:var(--ink);outline:none}
  .selwrap::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:12px;pointer-events:none}
  .favbtn{flex:none;display:inline-flex;align-items:center;gap:5px;padding:10px 13px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .favbtn .st{color:#5b6b85;font-size:14px;line-height:1}
  .favbtn[aria-pressed="true"]{background:rgba(255,207,92,.14);border-color:rgba(255,207,92,.5);color:var(--gold)}
  .favbtn[aria-pressed="true"] .st{color:var(--gold)}

  /* ---------- filters ---------- */
  .filters{padding:2px 0 6px}
  .frow{display:flex;align-items:center;gap:8px;margin:0 0 7px;min-width:0}
  .flab{flex:none;width:34px;font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:-.01em}
  .chips{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    padding:1px 0;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;
    color:var(--ink2);background:rgba(255,255,255,.05);border:1px solid transparent;white-space:nowrap}
  .chip:active{background:rgba(255,255,255,.11)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(79,141,255,.35)}
  .chip.on.money{background:#2f6bd6}
  .freset-row{display:flex;justify-content:space-between;align-items:center;padding:2px 1px 4px;min-height:20px}
  .fsum{font-size:11.5px;color:var(--ink3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .freset{font-size:11.5px;color:var(--ink2);text-decoration:underline;padding:0}

  /* ---------- list ---------- */
  main{padding:6px 0 4px}
  .list{display:flex;flex-direction:column;gap:11px}
  .card{background:linear-gradient(175deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:16px;padding:13px 13px 12px;box-shadow:0 8px 22px rgba(0,0,0,.3);min-width:0;
    cursor:pointer;transition:border-color .15s ease, transform .12s ease}
  .card:active{transform:scale(.994);border-color:rgba(79,141,255,.45)}
  .openhint{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin:9px 0 0;
    font-size:11.5px;font-weight:700;color:var(--ink3)}
  .openhint .ar{font-size:14px;line-height:1;margin-top:-1px}
  .badges{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0 0 8px}
  .b{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:7px;
    font-size:10.5px;font-weight:800;white-space:nowrap}
  .b.cat{background:rgba(255,255,255,.08);color:#cfdcf3}
  .b.court{background:rgba(255,107,107,.14);color:#ffb3b3;border:1px solid rgba(255,107,107,.32)}
  .b.onbid{background:rgba(61,220,151,.13);color:#8ff0c4;border:1px solid rgba(61,220,151,.3)}
  .b.dday{background:rgba(255,207,92,.14);color:var(--gold);border:1px solid rgba(255,207,92,.32)}
  .b.dday.soon{background:rgba(255,107,107,.18);color:#ffadad;border-color:rgba(255,107,107,.45)}
  .b.dday.past{background:rgba(255,255,255,.05);color:var(--ink3);border-color:var(--line)}
  .star{margin-left:auto;flex:none;width:32px;height:28px;display:grid;place-items:center;border-radius:9px;
    font-size:16px;line-height:1;color:#4a5872;background:rgba(255,255,255,.05);border:1px solid transparent}
  .star[aria-pressed="true"]{color:var(--gold);background:rgba(255,207,92,.13);border-color:rgba(255,207,92,.35)}
  .ctitle{margin:0 0 3px;font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.32;word-break:keep-all;overflow-wrap:anywhere}
  .ccase{margin:0 0 9px;font-size:11.5px;color:var(--ink3);font-weight:600;word-break:break-all}
  .price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:0 0 3px}
  .price .v{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.02em}
  .price .u{font-size:11.5px;font-weight:700;color:var(--ink3)}
  .price .dp{font-size:12px;font-weight:700;color:var(--accent2);background:rgba(123,209,255,.1);
    border-radius:7px;padding:2px 7px;white-space:nowrap}
  .nums{display:flex;gap:5px 11px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin:0 0 9px}
  .nums b{color:var(--ink2);font-weight:700}
  .nums .rv{color:var(--warn);font-weight:800}
  .note{margin:0 0 11px;font-size:12.5px;line-height:1.5;color:#c3d0e4;word-break:keep-all;overflow-wrap:anywhere}
  .note .risk{color:#ffa8a8;font-weight:800}
  .links{display:flex;gap:7px}
  .links a{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;
    padding:9px 6px;border-radius:11px;font-size:12.5px;font-weight:700;text-decoration:none;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
  .links a:active{background:rgba(255,255,255,.12)}
  .links a.map{color:#9be8be;border-color:rgba(61,220,151,.28);background:rgba(61,220,151,.09)}

  .empty{padding:44px 16px;text-align:center;color:var(--ink3);font-size:13.5px;line-height:1.7}
  .empty .big{font-size:32px;display:block;margin-bottom:8px;opacity:.7}
  .empty button{margin-top:12px;padding:9px 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;font-size:13px}

  /* ---------- bottom sheet ---------- */
  .sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheetbg{position:absolute;inset:0;background:rgba(3,8,18,.7);animation:fade .18s ease}
  .sheetbox{position:relative;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#16233a,#0f1a2b);
    border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
    padding:9px 15px calc(15px + var(--safe-b));box-shadow:0 -14px 44px rgba(0,0,0,.6);
    animation:slideup .24s cubic-bezier(.22,1,.36,1)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes slideup{from{transform:translateY(20px);opacity:.35}to{transform:translateY(0);opacity:1}}
  .grab{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:2px auto 11px}
  .sx{position:absolute;right:11px;top:9px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.08);color:var(--ink2);font-size:12px;display:grid;place-items:center}
  .sheetbox .badges{margin:0 0 8px}
  .sheetbox h2{margin:0 0 4px;font-size:17px;font-weight:800;line-height:1.32;letter-spacing:-.02em;
    padding-right:38px;word-break:keep-all;overflow-wrap:anywhere}
  .sheetbox .ccase{margin:0 0 12px;font-size:11.5px}
  .kv{border-top:1px solid var(--line);margin:0 0 12px}
  .kv .row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(46,64,92,.55);font-size:12.5px}
  .kv .k{flex:0 0 62px;color:var(--ink3);font-weight:700}
  .kv .v{flex:1;min-width:0;font-weight:600;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
  .kv .v .em{color:#fff;font-weight:800}
  .kv .v .rv{color:var(--warn);font-weight:800}
  .snote{margin:0 0 14px;font-size:12.5px;line-height:1.6;color:#c3d0e4;word-break:keep-all;overflow-wrap:anywhere}
  .snote b{color:var(--ink2);font-weight:800;margin-right:4px}
  .sbtns{display:flex;gap:7px}
  .sbtns button,.sbtns a{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
    padding:11px 5px;border-radius:12px;font-size:12.5px;font-weight:800;text-decoration:none;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
  .sbtns .sfav[aria-pressed="true"]{background:rgba(255,207,92,.16);border-color:rgba(255,207,92,.5);color:var(--gold)}
  .sbtns .map{color:#9be8be;border-color:rgba(61,220,151,.28);background:rgba(61,220,151,.09)}

  footer{padding:22px 2px 8px;color:#5b6b85;font-size:11px;line-height:1.7;text-align:center}
  footer b{color:#7f8fa9}
  .morewrap{display:flex;justify-content:center;padding:14px 0 2px}
  .more{padding:11px 22px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);
    color:var(--ink);font-size:13px;font-weight:800}
  .toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translate(-50%,14px);
    background:rgba(24,36,58,.97);border:1px solid var(--line);color:var(--ink);font-size:12.5px;font-weight:700;
    padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="app">
  <div class="wrap">
    <div class="hdr">
      <div class="brand">
        <span class="ico" aria-hidden="true">🏛️</span>
        <h1><span class="t1">후니의</span><span class="t2">경·공매 검색기</span></h1>
      </div>
      <a class="home-pill" href="/" aria-label="전체 앱 목록으로 이동">🏠 앱 목록</a>
    </div>
    <div class="statbar">
      <span class="pill">📅 데이터 기준 <b>2026-11-23</b></span>
      <span class="pill count">🔎 <b id="cnt">0</b>건 / 전체 <span id="cntAll">0</span>건</span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="searchbar">
    <span class="sico" aria-hidden="true">🔍</span>
    <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
           placeholder="물건명·사건번호·지역·메모 검색">
    <button class="clr" id="qclr" hidden aria-label="검색어 지우기">✕</button>
  </div>

  <div class="ctrlrow">
    <div class="selwrap">
      <select id="sort" aria-label="정렬">
        <option value="price_asc">최저가 낮은순</option>
        <option value="price_desc">최저가 높은순</option>
        <option value="date_asc">기일 임박순</option>
        <option value="fail_desc">유찰 많은순</option>
      </select>
    </div>
    <button class="favbtn" id="favonly" aria-pressed="false"><span class="st">★</span> 관심만</button>
  </div>

  <section class="filters" aria-label="필터">
    <div class="frow">
      <span class="flab">구분</span>
      <div class="chips" id="f-source"></div>
    </div>
    <div class="frow">
      <span class="flab">종류</span>
      <div class="chips" id="f-cat"></div>
    </div>
    <div class="frow">
      <span class="flab">금액</span>
      <div class="chips" id="f-money"></div>
    </div>
    <div class="frow">
      <span class="flab">지역</span>
      <div class="chips" id="f-region"></div>
    </div>
    <div class="freset-row">
      <span class="fsum" id="fsum"></span>
      <button class="freset" id="freset">필터 초기화</button>
    </div>
  </section>

  <main>
    <div class="list" id="list"></div>
    <div class="morewrap" id="morewrap" hidden><button class="more" id="more">더 보기</button></div>
  </main>

  <footer>
    출처: <b>대법원 법원경매정보</b> · <b>온비드</b> (2026-11-23 조회 기준)<br>
    감정가·최저가·보증금은 조회 시점 표기이며, 입찰 전 <b>매각물건명세서·등기부</b> 확인이 필요합니다.<br>
    leechardhun-hash.github.io · 홈 화면에 추가하면 앱처럼 열립니다
  </footer>
</div>

<div class="sheetwrap" id="sheetwrap" hidden>
  <div class="sheetbg" data-close></div>
  <section class="sheetbox" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="grab"></div>
    <button class="sx" data-close aria-label="닫기">✕</button>
    <div id="sbody"></div>
  </section>

<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('auction-data').textContent);

  var FAV_KEY = 'huni-auction-favs';
  var PAGE = 30;

  var state = {
    source: '전체', cat: '전체', money: '전체', region: '전체',
    q: '', sort: 'price_asc', favOnly: false, shown: PAGE
  };

  var SOURCES = ['전체', '법원경매', '온비드'];
  var CATS = ['전체', '주거', '토지', '상가', '차량', '콘도', '기타'];
  var MONEY = [
    { key: '전체' },
    { key: '보증금 100만 이하', test: function (d) { return d.deposit <= 1000000; } },
    { key: '보증금 500만 이하', test: function (d) { return d.deposit <= 5000000; } },
    { key: '최저가 3,000만 이하', test: function (d) { return d.minPrice <= 30000000; } },
    { key: '최저가 1억 이하', test: function (d) { return d.minPrice <= 100000000; } },
    { key: '1억 초과', test: function (d) { return d.minPrice > 100000000; } }
  ];
  var REGIONS = ['전체', '서울', '경기', '인천', '강원', '충청·대전', '전라·광주', '부산·경남', '대구·경북', '제주'];

  var favs = loadFavs();

  function loadFavs() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveFavs() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {}
  }
  function isFav(id) { return favs.indexOf(id) !== -1; }

  /* ---------- formatting ---------- */
  function man(n) {
    var v = n / 10000;
    if (v < 10) return String(Math.round(v * 100) / 100);
    if (v < 1000) return String(Math.round(v * 10) / 10);
    return Math.round(v).toLocaleString('ko-KR');
  }
  function won(n) {
    if (n >= 100000000) {
      var eok = Math.floor(n / 100000000);
      var rest = Math.round((n % 100000000) / 10000);
      return rest > 0 ? eok + '억 ' + rest.toLocaleString('ko-KR') + '만' : eok + '억';
    }
    return man(n) + '만';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function todayNum() {
    var d = new Date();
    return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function dayDiff(iso) {
    var p = iso.split('-');
    return Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - todayNum()) / 86400000);
  }
  function dday(iso) {
    var d = dayDiff(iso);
    if (d < 0) return { text: '기일 지남', cls: ' past' };
    if (d === 0) return { text: '오늘 마감', cls: ' soon' };
    if (d === 1) return { text: '내일', cls: ' soon' };
    if (d <= 7) return { text: 'D-' + d, cls: ' soon' };
    return { text: 'D-' + d, cls: '' };
  }
  function dateText(iso) {
    var p = iso.split('-');
    return p[0] + '.' + p[1] + '.' + p[2];
  }
  function riskify(text) {
    var t = esc(text);
    return t.replace(/(인수|지분|몰취|위반|체납|맹지|명도|우선매수|휴장|파산|제한경쟁|유치권|미등기|이행강제금|비추천|사용 불가|보증금 2배)/g,
      '<span class="risk">$1</span>');
  }
  function mapUrl(d) {
    return 'https://map.naver.com/p/search/' + encodeURIComponent(d.mapQuery || d.title);
  }
  function ratio(d) {
    if (!d.appraisalPrice || d.appraisalPrice <= 0) return null;
    return Math.round((d.minPrice / d.appraisalPrice) * 1000) / 10;
  }

  /* ---------- filtering ---------- */
  var moneyTest = MONEY.reduce(function (m, x) { m[x.key] = x.test; return m; }, {});

  function matches(d) {
    if (state.source !== '전체' && d.source !== state.source) return false;
    if (state.cat !== '전체' && d.category !== state.cat) return false;
    if (state.region !== '전체' && d.region !== state.region) return false;
    var t = moneyTest[state.money];
    if (t && !t(d)) return false;
    if (state.favOnly && !isFav(d.id)) return false;
    if (state.q) {
      var hay = (d.title + ' ' + d.caseNo + ' ' + d.region + ' ' + d.category + ' ' + d.source + ' ' + d.note + ' ' + d.mapQuery).toLowerCase();
      var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < words.length; i++) {
        if (hay.indexOf(words[i]) === -1) return false;
      }
    }
    return true;
  }

  function sortList(arr) {
    var s = state.sort;
    return arr.slice().sort(function (a, b) {
      if (s === 'price_asc') return a.minPrice - b.minPrice;
      if (s === 'price_desc') return b.minPrice - a.minPrice;
      if (s === 'date_asc') {
        if (a.bidDate !== b.bidDate) return a.bidDate < b.bidDate ? -1 : 1;
        return a.minPrice - b.minPrice;
      }
      if (s === 'fail_desc') {
        if (b.failCount !== a.failCount) return b.failCount - a.failCount;
        return a.minPrice - b.minPrice;
      }
      return 0;
    });
  }

  /* ---------- render ---------- */
  function cardHtml(d) {
    var dd = dday(d.bidDate);
    var r = ratio(d);
    var fav = isFav(d.id);
    var srcCls = d.source === '법원경매' ? 'court' : 'onbid';
    var nums = [];
    nums.push('<span>감정 ' + (d.appraisalPrice ? won(d.appraisalPrice) : '미공개') +
      (r === null ? '' : ' · <span class="rv">' + r.toFixed(1) + '%</span>') + '</span>');
    nums.push('<span>유찰 <b>' + (d.failCount === 0 ? '신건' : d.failCount + '회') + '</b></span>');

    return '<article class="card" data-id="' + esc(d.id) + '" tabindex="0">' +
      '<div class="badges">' +
        '<span class="b cat">' + esc(d.category) + '</span>' +
        '<span class="b ' + srcCls + '">' + esc(d.source) + '</span>' +
        '<span class="b dday' + dd.cls + '">' + dd.text + '</span>' +
        '<button class="star" data-fav="' + esc(d.id) + '" aria-pressed="' + (fav ? 'true' : 'false') +
          '" aria-label="관심 물건 ' + (fav ? '해제' : '등록') + '">★</button>' +
      '</div>' +
      '<h3 class="ctitle">' + esc(d.title) + '</h3>' +
      '<p class="ccase">' + esc(d.caseNo) + ' · ' + esc(d.region) + '</p>' +
      '<div class="price"><span class="v">' + won(d.minPrice) + '</span><span class="u">원 최저가</span>' +
        '<span class="dp">보증금 ' + won(d.deposit) + '</span></div>' +
      '<div class="nums">' + nums.join('') + '</div>' +
      '<p class="note">' + riskify(d.note) + '</p>' +
      '<div class="links">' +
        '<a class="map" href="' + mapUrl(d) + '" target="_blank" rel="noopener">🗺️ 네이버 지도</a>' +
        '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">🔗 상세/검색</a>' +
      '</div>' +
      '<div class="openhint">자세히 보기 <span class="ar" aria-hidden="true">›</span></div>' +
    '</article>';
  }

  /* ---------- detail sheet ---------- */
  function sheetHtml(d) {
    var dd = dday(d.bidDate);
    var r = ratio(d);
    var fav = isFav(d.id);
    var rows = [
      ['구분', esc(d.source)],
      ['종류', esc(d.category)],
      ['지역', esc(d.region)],
      ['소재지', esc(d.mapQuery || '-')],
      ['감정가', d.appraisalPrice ? won(d.appraisalPrice) + ' 원' : '미공개'],
      ['최저가', '<span class="em">' + won(d.minPrice) + ' 원</span>' +
        (r === null ? '' : ' <span class="rv">감정가 대비 ' + r.toFixed(1) + '%</span>')],
      ['보증금', '<span class="em">' + won(d.deposit) + ' 원</span>'],
      ['유찰', d.failCount === 0 ? '신건' : d.failCount + '회'],
      ['입찰기일', esc(dateText(d.bidDate)) + ' <span class="' + (dd.cls ? 'rv' : '') + '">' + dd.text + '</span>']
    ];
    return '<div class="badges">' +
        '<span class="b cat">' + esc(d.category) + '</span>' +
        '<span class="b ' + (d.source === '법원경매' ? 'court' : 'onbid') + '">' + esc(d.source) + '</span>' +
        '<span class="b dday' + dd.cls + '">' + dd.text + '</span>' +
      '</div>' +
      '<h2 id="sTitle">' + esc(d.title) + '</h2>' +
      '<p class="ccase">' + esc(d.caseNo) + '</p>' +
      '<div class="kv">' + rows.map(function (x) {
        return '<div class="row"><span class="k">' + x[0] + '</span><span class="v">' + x[1] + '</span></div>';
      }).join('') + '</div>' +
      '<p class="snote"><b>주의</b> ' + riskify(d.note) + '</p>' +
      '<div class="sbtns">' +
        '<button class="sfav" data-sfav="' + esc(d.id) + '" aria-pressed="' + (fav ? 'true' : 'false') + '">' +
          (fav ? '★' : '☆') + ' 관심</button>' +
        '<a class="map" href="' + mapUrl(d) + '" target="_blank" rel="noopener">🗺️ 네이버 지도</a>' +
        '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">🔗 상세/검색</a>' +
      '</div>';
  }

  var sheetWrap = document.getElementById('sheetwrap');
  var sheetOpenId = null;

  function openSheet(id) {
    var d = null;
    for (var i = 0; i < DATA.length; i++) { if (DATA[i].id === id) { d = DATA[i]; break; } }
    if (!d) return;
    sheetOpenId = id;
    document.getElementById('sbody').innerHTML = sheetHtml(d);
    sheetWrap.hidden = false;
    document.body.style.overflow = 'hidden';
    var box = sheetWrap.querySelector('.sheetbox');
    if (box) box.scrollTop = 0;
  }

  function closeSheet() {
    sheetOpenId = null;
    sheetWrap.hidden = true;
    document.body.style.overflow = '';
  }

  function render() {
    var all = DATA.filter(matches);
    var sorted = sortList(all);
    var listEl = document.getElementById('list');
    var slice = sorted.slice(0, state.shown);

    document.getElementById('cnt').textContent = all.length.toLocaleString('ko-KR');
    document.getElementById('cntAll').textContent = DATA.length.toLocaleString('ko-KR');

    if (!all.length) {
      listEl.innerHTML = '<div class="empty"><span class="big">🔍</span>' +
        (state.favOnly && !favs.length
          ? '아직 ★ 관심 물건이 없습니다.<br>카드 오른쪽 별을 눌러 담아 두세요.'
          : '조건에 맞는 물건이 없습니다.<br>필터를 줄이거나 검색어를 바꿔 보세요.') +
        '<br><button id="emptyrst">필터 초기화</button></div>';
      document.getElementById('morewrap').hidden = true;
    } else {
      listEl.innerHTML = slice.map(cardHtml).join('');
      var mw = document.getElementById('morewrap');
      mw.hidden = slice.length >= all.length;
      if (!mw.hidden) {
        document.getElementById('more').textContent = '더 보기 (' + (all.length - slice.length) + '건 남음)';
      }
    }

    // summary line
    var parts = [];
    if (state.source !== '전체') parts.push(state.source);
    if (state.cat !== '전체') parts.push(state.cat);
    if (state.money !== '전체') parts.push(state.money);
    if (state.region !== '전체') parts.push(state.region);
    if (state.q) parts.push('"' + state.q + '"');
    if (state.favOnly) parts.push('★ 관심');
    document.getElementById('fsum').textContent = parts.length ? '적용: ' + parts.join(' · ') : '전체 물건을 보는 중';
  }

  /* ---------- chips ---------- */
  function buildChips(el, items, field, cls) {
    el.innerHTML = items.map(function (x) {
      var key = typeof x === 'string' ? x : x.key;
      var on = state[field] === key;
      return '<button class="chip' + (on ? ' on' : '') + (cls ? ' ' + cls : '') + '" data-field="' + field +
        '" data-val="' + esc(key) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(key) + '</button>';
    }).join('');
  }
  function buildAllChips() {
    buildChips(document.getElementById('f-source'), SOURCES, 'source');
    buildChips(document.getElementById('f-cat'), CATS, 'cat');
    buildChips(document.getElementById('f-money'), MONEY.map(function (m) { return m.key; }), 'money', 'money');
    buildChips(document.getElementById('f-region'), REGIONS, 'region');
  }

  document.querySelector('.filters').addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    state[btn.dataset.field] = btn.dataset.val;
    state.shown = PAGE;
    buildAllChips();
    render();
  });

  /* ---------- search ---------- */
  var qEl = document.getElementById('q');
  var qClr = document.getElementById('qclr');
  qEl.addEventListener('input', function () {
    state.q = qEl.value.trim();
    qClr.hidden = !qEl.value;
    state.shown = PAGE;
    render();
  });
  qClr.addEventListener('click', function () {
    qEl.value = ''; state.q = ''; qClr.hidden = true; state.shown = PAGE; render(); qEl.focus();
  });

  /* ---------- sort / fav ---------- */
  document.getElementById('sort').addEventListener('change', function (e) {
    state.sort = e.target.value;
    state.shown = PAGE;
    render();
  });
  var favBtn = document.getElementById('favonly');
  favBtn.addEventListener('click', function () {
    state.favOnly = !state.favOnly;
    favBtn.setAttribute('aria-pressed', state.favOnly ? 'true' : 'false');
    state.shown = PAGE;
    render();
  });

  /* ---------- 관심(★) ---------- */
  function toggleFav(id) {
    var i = favs.indexOf(id);
    if (i === -1) { favs.push(id); toast('★ 관심 물건에 담았습니다'); }
    else { favs.splice(i, 1); toast('관심에서 뺐습니다'); }
    saveFavs();
    return i === -1;
  }
  function syncFavUI(id) {
    var on = isFav(id);
    var cs = document.querySelector('.star[data-fav="' + id + '"]');
    if (cs) cs.setAttribute('aria-pressed', on ? 'true' : 'false');
    var sb = document.querySelector('.sfav[data-sfav="' + id + '"]');
    if (sb) {
      sb.setAttribute('aria-pressed', on ? 'true' : 'false');
      sb.innerHTML = (on ? '★' : '☆') + ' 관심';
    }
    if (state.favOnly) render();
    else document.getElementById('cnt').textContent = DATA.filter(matches).length.toLocaleString('ko-KR');
  }

  /* ---------- 목록 클릭 / 키보드 ---------- */
  var listRoot = document.getElementById('list');
  listRoot.addEventListener('click', function (e) {
    if (e.target.closest('#emptyrst')) { resetFilters(); return; }
    var st = e.target.closest('.star');
    if (st) { toggleFav(st.dataset.fav); syncFavUI(st.dataset.fav); return; }
    if (e.target.closest('a')) return; /* 지도·상세 링크는 그대로 열기 */
    var card = e.target.closest('.card');
    if (card) openSheet(card.dataset.id);
  });
  listRoot.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest('.card');
    if (!card) return;
    e.preventDefault();
    openSheet(card.dataset.id);
  });

  /* ---------- 상세 시트 닫기·관심 ---------- */
  sheetWrap.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closeSheet(); return; }
    var sf = e.target.closest('[data-sfav]');
    if (sf) { toggleFav(sf.dataset.sfav); syncFavUI(sf.dataset.sfav); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheetOpenId) closeSheet();
  });

  document.getElementById('more').addEventListener('click', function () {
    state.shown += PAGE;
    render();
  });

  function resetFilters() {
    state.source = '전체'; state.cat = '전체'; state.money = '전체'; state.region = '전체';
    state.q = ''; qEl.value = ''; qClr.hidden = true; state.shown = PAGE;
    buildAllChips();
    render();
  }
  document.getElementById('freset').addEventListener('click', resetFilters);

  /* ---------- toast ---------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1600);
  }

  /* ---------- boot ---------- */
  buildAllChips();
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
